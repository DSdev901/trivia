<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>General Trivia</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="preload"
      href="data/current-events/briefing-stamp.json"
      as="fetch"
      crossorigin
    />
  </head>
  <body class="is-home">
    <script>
      (function () {
        var raw = String(location.hash || "")
          .replace(/^#/, "")
          .replace(/^\/+|\/+$/g, "");
        if (raw) document.body.classList.remove("is-home");
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var seen = false;
        try {
          seen = Boolean(sessionStorage.getItem("trivia-intro-seen"));
        } catch (e) {}
        if (!raw && !reduce && !seen) {
          document.body.classList.add("has-skip-intro");
        }
      })();
    </script>
    <div class="skip-intro" id="skip-intro" role="dialog" aria-modal="true" aria-label="Enter site">
      <button type="button" class="skip-intro-skip" id="skip-intro-skip">
        Skip Intro
      </button>
      <div class="skip-intro-card">
        <img
          class="skip-intro-logo"
          src="trivia-general-logo-alt.png"
          alt=""
          width="96"
          height="96"
        />
        <p class="skip-intro-enter">ENTER SITE</p>
        <button type="button" class="skip-intro-go" id="skip-intro-enter">
          Enter
        </button>
      </div>
    </div>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="brand-logo-wrap">
            <img
              class="brand-logo brand-logo--badge"
              src="trivia-general-logo-alt.png"
              alt="General Trivia"
              width="96"
              height="96"
            />
            <span class="brand-eye-glint" aria-hidden="true"></span>
          </span>
          <div class="brand-text">
            <p class="brand-mark brand-mark--sr">General Trivia</p>
          </div>
        </div>
        <nav class="nav" id="nav" hidden>
          <button type="button" class="nav-btn" id="back-btn">Back</button>
          <button type="button" class="nav-btn" id="home-btn" aria-label="Home">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 3.2 3.5 10.2a.9.9 0 0 0-.3.7V20a1 1 0 0 0 1 1h5.2a.8.8 0 0 0 .8-.8V15.5h3.6v4.7a.8.8 0 0 0 .8.8H20a1 1 0 0 0 1-1v-9.1a.9.9 0 0 0-.3-.7L12 3.2Z"
              />
            </svg>
            <span class="nav-btn-label">Home</span>
          </button>
        </nav>
      </header>

      <main>
        <section id="view-categories" class="view"></section>
        <section id="view-hub" class="view" hidden></section>
        <section id="view-batches" class="view" hidden></section>
        <section id="view-presidents" class="view" hidden></section>
        <section id="view-detail" class="view" hidden></section>
        <section id="view-quiz-setup" class="view" hidden></section>
        <section id="view-quiz" class="view" hidden></section>
        <section id="view-quiz-done" class="view" hidden></section>
        <section id="view-flags" class="view" hidden></section>
        <section id="view-current-events" class="view" hidden></section>
        <section id="view-periodic-table" class="view" hidden></section>
        <section id="view-captured" class="view" hidden></section>
        <section id="view-geography" class="view" hidden></section>
        <section id="view-guestbook" class="view" hidden></section>
      </main>
    </div>
    <script>
      (function () {
        var skipIntro = document.getElementById("skip-intro");
        var app = document.querySelector(".app");
        var skip = document.getElementById("skip-intro-skip");
        var enter = document.getElementById("skip-intro-enter");
        function hideSplash() {
          document.body.classList.remove("has-skip-intro");
          if (app) app.inert = false;
          if (skipIntro) {
            skipIntro.setAttribute("aria-hidden", "true");
            skipIntro.inert = true;
          }
        }
        function dismiss() {
          try {
            sessionStorage.setItem("trivia-intro-seen", "1");
          } catch (e) {}
          hideSplash();
        }
        if (!document.body.classList.contains("has-skip-intro")) {
          hideSplash();
          return;
        }
        if (app) app.inert = true;
        skipIntro.removeAttribute("aria-hidden");
        skip.addEventListener("click", dismiss);
        enter.addEventListener("click", dismiss);
        document.addEventListener("keydown", function (ev) {
          if (
            ev.key === "Escape" &&
            document.body.classList.contains("has-skip-intro")
          ) {
            dismiss();
          }
        });
        skip.focus();
      })();
    </script>
    <script src="app.js" type="module"></script>
  </body>
</html>
