<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Upload questions · General Trivia</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <img
            class="brand-logo brand-logo--badge"
            src="../trivia-general-logo-alt.png"
            alt="General Trivia"
            width="96"
            height="96"
          />
          <div class="brand-text">
            <p class="brand-mark brand-mark--sr">General Trivia</p>
            <p class="brand-sub" id="subtitle">Upload questions</p>
          </div>
        </div>
        <nav class="nav" id="nav">
          <a class="nav-btn" href="../">Home</a>
        </nav>
      </header>
      <main>
        <section id="view-question-upload" class="view"></section>
      </main>
    </div>
    <script type="module">
      import { renderQuestionUpload } from "../captured.js";
      void renderQuestionUpload({
        root: document.getElementById("view-question-upload"),
      });
    </script>
  </body>
</html>
