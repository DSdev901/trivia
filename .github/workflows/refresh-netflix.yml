name: Refresh Netflix

# Netflix only, on demand: rebuild netflix.json (sources, TMDB, US Top 10,
# US availability), post the review checklist, and push. The Tuesday
# "Refresh Current Events" run does the same plus Copilot briefs.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: current-events-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh Netflix
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NETFLIX_REVIEW_FILE: ${{ runner.temp }}/netflix-review.md
        run: node scripts/refresh-current-events.mjs --netflix

      - name: Post Netflix review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/post-netflix-review.sh "${{ runner.temp }}/netflix-review.md"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/git-push-current-events.sh "Refresh Netflix data" data/current-events/
