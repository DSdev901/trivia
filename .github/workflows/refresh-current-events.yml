name: Refresh Current Events

# Keeps Netflix and the Tuesday sports/entertainment/world briefing current.
# Sports, entertainment, and world headlines still update every 3 hours via
# the cache-espn-headlines, cache-entertainment, and cache-world workflows.
# Runs on a schedule in UTC; can also be triggered by hand from the
# repo's Actions tab ("Run workflow").

on:
  schedule:
    # Tuesdays 6:00 AM and 1:00 PM local (UTC-5) = 11:00 and 18:00 UTC.
    # During winter (CST, UTC-6) these fire an hour earlier local time.
    - cron: "0 11,18 * * 2"
  workflow_dispatch:

permissions:
  contents: write # needed to push the refreshed data commit
  copilot-requests: write # Copilot CLI rewrites the top briefing stories

concurrency:
  group: current-events-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh ESPN sports archive
        run: node scripts/cache-espn-headlines.mjs

      - name: Refresh entertainment archive
        run: node scripts/cache-entertainment.mjs

      - name: Refresh world archive
        run: node scripts/cache-world.mjs

      - name: Refresh current events data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/refresh-current-events.mjs

      # COPILOT_BILLING_TOKEN is optional. Remaining credits are read from
      # Copilot's quota API when possible. Skip Haiku only when remaining is
      # already 0; a failed or empty rewrite keeps the heuristic ranking.
      - name: Check Copilot credits
        id: briefing_budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_BILLING_TOKEN: ${{ secrets.COPILOT_BILLING_TOKEN }}
          COPILOT_BILLING_USER: DSdev901
          COPILOT_MONTHLY_CREDITS: "1500"
          BRIEFING_MODEL_FULL: claude-haiku-4.5
        run: |
          cp data/current-events/briefing.json /tmp/briefing.fallback.json
          node scripts/briefing-copilot-budget.mjs
          cp data/current-events/briefing.json /tmp/briefing.input.json

      - name: Rank Tuesday briefing with Copilot
        if: steps.briefing_budget.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ steps.briefing_budget.outputs.model }}
        run: |
          npm install -g @github/copilot
          echo "Copilot mode=${{ steps.briefing_budget.outputs.mode }} model=${COPILOT_MODEL} cards=${{ steps.briefing_budget.outputs.keep }} remaining=${{ steps.briefing_budget.outputs.remaining }}"
          BRIEFING_FALLBACK=/tmp/briefing.fallback.json \
          BRIEFING_INPUT=/tmp/briefing.input.json \
          BRIEFING_TOP_N=40 \
            node scripts/run-briefing-copilot.mjs \
            || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/git-push-current-events.sh "Refresh current events data"
