name: Refresh Current Events

# Keeps Netflix and the Tuesday sports/entertainment briefing current.
# Sports and entertainment headlines still update every 3 hours via the
# cache-espn-headlines and cache-entertainment workflows.
# Runs on a schedule in UTC; can also be triggered by hand from the
# repo's Actions tab ("Run workflow").

on:
  schedule:
    # Tuesdays 6:00 AM and 1:00 PM local (UTC-5) = 11:00 and 18:00 UTC.
    # During winter (CST, UTC-6) these fire an hour earlier local time.
    - cron: "0 11,18 * * 2"
  workflow_dispatch:

permissions:
  contents: write # needed to push the refreshed data commit
  copilot-requests: write # Copilot CLI ranks the briefing on this runner

concurrency:
  group: current-events-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh ESPN sports archive
        run: node scripts/cache-espn-headlines.mjs

      - name: Refresh entertainment archive
        run: node scripts/cache-entertainment.mjs

      - name: Refresh current events data
        run: node scripts/refresh-current-events.mjs

      - name: Rank Tuesday briefing with Copilot (Haiku)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_MODEL: claude-haiku-4.5
        run: |
          npm install -g @github/copilot
          cp data/current-events/briefing.json /tmp/briefing.fallback.json
          copilot -p "$(cat scripts/briefing-prompt.md)" \
            --model=claude-haiku-4.5 \
            --no-ask-user \
            --add-dir=data/current-events \
            --allow-tool='write(data/current-events/briefing.json)' \
            --allow-all-paths \
            --deny-tool=shell \
            --max-ai-credits=250
          if cmp -s data/current-events/briefing.json /tmp/briefing.fallback.json; then
            echo "Copilot did not change the briefing — keeping heuristic ranking."
          elif ! node scripts/validate-briefing.mjs; then
            echo "Copilot briefing was invalid — keeping heuristic ranking."
            cp /tmp/briefing.fallback.json data/current-events/briefing.json
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-events/
          if git diff --cached --quiet; then
            echo "No changes — data already up to date."
          else
            git commit -m "Refresh current events data"
            git push
          fi
