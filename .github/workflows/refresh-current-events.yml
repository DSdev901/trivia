name: Refresh Current Events

# Keeps data/current-events/*.json fresh so the live site stays current.
# Runs on a schedule in UTC; can also be triggered by hand from the
# repo's Actions tab ("Run workflow").

on:
  schedule:
    # Tuesdays 6:00 AM and 1:00 PM local (UTC-5) = 11:00 and 18:00 UTC.
    # During winter (CST, UTC-6) these fire an hour earlier local time.
    - cron: "0 11,18 * * 2"
  workflow_dispatch:

permissions:
  contents: write # needed to push the refreshed data commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh current events data
        run: node scripts/refresh-current-events.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-events/
          if git diff --cached --quiet; then
            echo "No changes — data already up to date."
          else
            git commit -m "Refresh current events data"
            git push
          fi
